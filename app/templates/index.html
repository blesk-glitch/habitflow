{% extends "base.html" %}
{% block content %}
<div class="text-center">
    <h1>Добро пожаловать в HabitFlow!</h1>
    <p>Ваш помощник в формировании привычек.</p>
    {% if not current_user.is_authenticated %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Войти</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-secondary">Зарегистрироваться</a>
    {% else %}
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-success">Перейти к задачам</a>
    {% endif %}
</div>
{% endblock %}
